<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고정 메모</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sidebar.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2v.8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>
  <symbol id="i-pin-off" viewBox="0 0 24 24"><path d="M12 17v5M15 9.3V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8.5M2 2l20 20"/><path d="M9 9v1.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2v.8a1 1 0 0 0 1 1h11"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M17 7 7 17M7 7l10 10"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
</svg>

  <div id="tabRail" class="tab-rail"></div>

  <section id="panel" class="panel hidden">
    <header class="panel-head">
      <div class="panel-eyebrow"><svg class="icon"><use href="#i-pin"/></svg>고정 메모</div>
      <strong id="panelTitle" class="panel-title">메모</strong>
      <div id="panelMeta" class="panel-meta"></div>
      <div id="panelProgress" class="panel-progress hidden"><i></i></div>
      <button id="closePanel" class="panel-close" aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
    </header>
    <main id="panelContent" class="panel-content"></main>
    <footer class="panel-actions">
      <span id="panelUpdated" class="panel-updated"></span>
      <button id="unpinBtn" class="ghost" title="고정 해제"><svg class="icon"><use href="#i-pin-off"/></svg>고정 해제</button>
      <button id="editBtn" class="primary"><svg class="icon"><use href="#i-edit"/></svg>편집</button>
    </footer>
  </section>
<script src="browser-shim.js"></script>
<script src="markdown.js"></script>
<script src="theme.js"></script>
<script src="status.js"></script>
<script src="sidebar.js"></script>
</body>
</html>
