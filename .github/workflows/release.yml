# 새 버전 배포: v로 시작하는 태그(예: v1.4.0)를 올리거나,
# GitHub 의 Actions 탭 → Release → "Run workflow" 버튼을 누르면
# package.json 의 버전으로 Windows 설치 파일을 만들어 GitHub Releases 에 올립니다.
# 설치된 앱은 여기 올라온 새 버전을 자동으로 찾아 내려받습니다.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rebuild:
        description: '같은 버전의 릴리스가 이미 있으면 지우고 다시 만들기'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 릴리스 준비 (태그 확인 · 릴리스 한 개 만들기)
        # electron-builder 는 파일을 동시에 올리면서 릴리스가 없으면 각자 만들어 버려
        # 같은 버전 릴리스가 두 개 생길 수 있습니다. 그래서 릴리스를 여기서 먼저 하나 만들어 둡니다.
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 package.json 버전 $VERSION 이 다릅니다. npm version 으로 올려 주세요."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.rebuild }}" = "true" ]; then
              # 같은 태그의 릴리스를 모두 지웁니다(태그는 그대로 둡니다).
              while gh release view "$TAG" >/dev/null 2>&1; do gh release delete "$TAG" --yes; done
            else
              echo "::error::$TAG 은 이미 릴리스된 버전입니다. package.json 의 version 을 올리거나, 'rebuild' 를 켜고 다시 실행해 주세요."
              exit 1
            fi
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

          gh release create "$TAG" --verify-tag --title "$VERSION" --notes-file release-notes.md

      - run: npm install

      - name: 설치 파일 만들고 Releases 에 올리기
        run: npm run release

      - name: 릴리스 확인 (한 개 · 파일 3개)
        shell: bash
        run: |
          COUNT="$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName == \"$TAG\")] | length")"
          ASSETS="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")')"
          echo "릴리스 수: $COUNT / 파일: $ASSETS"
          [ "$COUNT" = "1" ] || { echo "::error::$TAG 릴리스가 $COUNT 개입니다."; exit 1; }
          for f in "DesktopCalendarMemo_${TAG}.exe" "DesktopCalendarMemo_${TAG}.exe.blockmap" "latest.yml"; do
            case ",$ASSETS," in *",$f,"*) ;; *) echo "::error::$f 가 릴리스에 없습니다."; exit 1;; esac
          done
