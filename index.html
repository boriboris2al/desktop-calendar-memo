<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desktop Calendar Memo 미리보기</title>
<!-- 브라우저 미리보기: 실제 앱 화면(renderer/*.html)을 iframe 으로 띄우고,
     main.js 가 하던 창 크기 조절(메모 리스트 열기, 사이드 탭 펼치기)을 이 페이지가 대신합니다. -->
<style>
/* 레이아웃: 상단 안내 막대 + 화면 크기에 맞춰 축소되는 가상 바탕화면 */
:root{
  --chrome-bg:#F4F5F7;
  --chrome-fg:#1D1D1F;
  --chrome-muted:#6E6E73;
  --chrome-line:rgba(60,60,67,.14);
  --chrome-btn:#FFFFFF;
  --accent:#E0577B;
  --wall-a:#9DB7CF;
  --wall-b:#D8C8B8;
  --wall-c:#7F9BB5;
  --font:"Pretendard","SF Pro Text","Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--chrome-bg:#1C1C1E;--chrome-fg:#F2F2F7;--chrome-muted:#A1A1A6;--chrome-line:rgba(235,235,245,.14);--chrome-btn:#2C2C2E;--wall-a:#2E4257;--wall-b:#4A3F38;--wall-c:#22303F;color-scheme:dark}}
:root[data-theme="dark"]{--chrome-bg:#1C1C1E;--chrome-fg:#F2F2F7;--chrome-muted:#A1A1A6;--chrome-line:rgba(235,235,245,.14);--chrome-btn:#2C2C2E;--wall-a:#2E4257;--wall-b:#4A3F38;--wall-c:#22303F;color-scheme:dark}

html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--chrome-bg);color:var(--chrome-fg);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--chrome-line)}
.bar h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.tag{padding:2px 8px;border-radius:999px;background:rgba(224,87,123,.12);color:var(--accent);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.note{flex:1;min-width:0;font-size:12px;color:var(--chrome-muted)}
.bar button{height:30px;padding:0 12px;border:1px solid var(--chrome-line);border-radius:8px;background:var(--chrome-btn);color:var(--chrome-fg);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.bar button:hover{border-color:var(--accent);color:var(--accent)}
.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.viewport{flex:1;min-height:0;position:relative;overflow:hidden;
  background:
    radial-gradient(1200px 700px at 15% 10%,var(--wall-b),transparent 60%),
    radial-gradient(900px 800px at 90% 90%,var(--wall-c),transparent 60%),
    var(--wall-a)}
.desk{position:absolute;left:50%;top:50%;width:1960px;height:940px;transform-origin:center}
.desk iframe{position:absolute;border:0;background:transparent;color-scheme:light;transition:width .2s ease,height .2s ease,top .2s ease}
#calendarFrame{left:40px;top:90px;width:1120px;height:760px}
#sidebarFrame{right:0;width:58px;height:0}
#sidebarFrame.left{right:auto;left:0}

.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:9px 14px;border-radius:10px;background:rgba(29,29,31,.88);color:#fff;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:720px){.note{display:none}.bar{padding:10px 16px}}
@media (prefers-reduced-motion:reduce){.desk iframe,.toast{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <h1>Desktop Calendar Memo</h1>
  <span class="tag">v1.4.1 미리보기</span>
  <span class="note">브라우저에서 실제 앱 화면을 그대로 띄운 미리보기입니다. 데이터는 이 브라우저에만 저장돼요.</span>
  <button id="updateDemoBtn" type="button">업데이트 알림 미리보기</button>
  <button id="resetBtn" type="button">예시 데이터로 초기화</button>
</header>
<main class="viewport" id="viewport">
  <div class="desk" id="desk">
    <iframe id="calendarFrame" src="renderer/calendar.html" title="캘린더 창"></iframe>
    <iframe id="sidebarFrame" src="renderer/sidebar.html" title="사이드 고정 메모"></iframe>
  </div>
  <div class="toast" id="toast" role="status"></div>
</main>
<script>
(function(){
  // main.js 와 같은 창 크기 규칙
  const DESK={w:1960,h:940},CAL={w:1120,h:760,memo:390},SIDE={collapsed:58,expanded:390,tab:102,gap:6};
  const desk=document.getElementById('desk'),vp=document.getElementById('viewport');
  const cal=document.getElementById('calendarFrame'),side=document.getElementById('sidebarFrame');
  let sidebarOpen=false,pinnedCount=0;

  function fit(){
    const s=Math.min(vp.clientWidth/DESK.w,vp.clientHeight/DESK.h);
    desk.style.transform=`translate(-50%,-50%) scale(${s})`;
  }
  function placeSidebar(){
    if(!pinnedCount){side.style.height='0px';side.style.visibility='hidden';return}
    const h=sidebarOpen?Math.min(640,Math.max(420,DESK.h-100)):Math.min(DESK.h-20,Math.max(72,pinnedCount*SIDE.tab+(pinnedCount-1)*SIDE.gap+16));
    side.style.visibility='visible';
    side.style.width=(sidebarOpen?SIDE.expanded:SIDE.collapsed)+'px';
    side.style.height=h+'px';
    side.style.top=Math.round((DESK.h-h)/2)+'px';
  }
  function countPinned(d){pinnedCount=((d&&d.items)||[]).filter(x=>x.pinned).length;if(!pinnedCount)sidebarOpen=false;placeSidebar()}
  function send(frame,type,payload){frame.contentWindow&&frame.contentWindow.postMessage({dcm:true,type,payload},'*')}
  let toastTimer;
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

  window.addEventListener('message',e=>{
    const m=e.data;if(!m||!m.dcm)return;
    const from=e.source===cal.contentWindow?cal:e.source===side.contentWindow?side:null;
    if(!from)return;
    const other=from===cal?side:cal;
    switch(m.type){
      case 'ready':
        // 사이드 창이 처음 뜰 때 고정 메모 개수와 좌우 위치를 맞춥니다.
        if(from===side){side.classList.toggle('left',m.payload.side==='left');pinnedCount=m.payload.pinned;placeSidebar()}
        break;
      case 'data':send(other,'data',m.payload);countPinned(m.payload);break;
      case 'memoList':cal.style.width=(CAL.w+(m.payload?CAL.memo:0))+'px';break;
      case 'sidebarExpanded':sidebarOpen=m.payload;placeSidebar();break;
      case 'edit':send(cal,'edit',m.payload);break;
      case 'settings':send(other,'settings',m.payload);break;
      case 'side':side.classList.toggle('left',m.payload==='left');send(side,'side',m.payload);break;
      case 'close':case 'minimize':toast('미리보기에서는 창을 닫거나 최소화할 수 없어요.');break;
      case 'toast':toast(m.payload);break;
    }
  });

  document.getElementById('updateDemoBtn').onclick=()=>send(cal,'update-demo');
  document.getElementById('resetBtn').onclick=()=>{
    sidebarOpen=false;cal.style.width=CAL.w+'px';
    send(cal,'reset');send(side,'reset');
    toast('예시 데이터로 되돌렸어요.');
  };
  window.addEventListener('resize',fit);fit();placeSidebar();
})();
</script>
</body>
</html>
